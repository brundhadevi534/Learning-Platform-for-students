name: Run Spring Boot App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Start app
        env:
          PORT: 8080
        run: |
          java -jar target/learning-platform-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          sleep 20
          curl -I http://localhost:8080
